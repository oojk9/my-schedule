<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일정·근무 수첩</title>
<meta name="description" content="약속·예약 일정, 월별 근무 횟수, 프로젝트 진행 상황을 한곳에서 관리하는 개인 수첩">
<meta name="theme-color" content="#ECEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" crossorigin>
<style>
/* Layout: 포켓 수첩 — sticky header and one working column (two panes on wide screens).
   The month grid is the hero; every counted day gets an ink stamp (도장).
   Tabs sit at the bottom on phones and move into the header on wide screens. */
:root{
  --paper:#ECEFEA; --dot:#D3D9D2; --sheet:#FFFFFF; --sheet-2:#F3F5F2;
  --ink:#16201B; --ink-2:#4D5953; --ink-3:#848F89; --rule:#D5DBD4;
  --pine:#1B6A52; --on-pine:#FFFFFF; --pine-wash:#DBECE3;
  --sun:#D1392F; --sat:#2A5EC2; --hl:#FFDF6E; --danger:#C1342A;
  --scrim:rgba(12,18,15,.46);
  --shadow:0 1px 2px rgba(20,32,26,.05),0 10px 26px -18px rgba(20,32,26,.28);
  --c-pine:#1B6A52; --c-orange:#BF5419; --c-blue:#2C62C4; --c-violet:#6B48BC;
  --c-rose:#B93D6A; --c-amber:#9C6700; --c-teal:#0D7A75; --c-slate:#5A6762;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1412; --dot:#1C2420; --sheet:#171D1A; --sheet-2:#1D2521; --ink:#E5ECE8; --ink-2:#A9B4AE; --ink-3:#76827C; --rule:#2A3430;
    --pine:#52C29A; --on-pine:#0B1913; --pine-wash:#193A2E; --sun:#FF7268; --sat:#7EA8FF; --hl:#6B5816; --danger:#FF7B70;
    --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);
    --c-pine:#52C29A; --c-orange:#F08C55; --c-blue:#7AA7F7; --c-violet:#AC8FF3; --c-rose:#EF83AA; --c-amber:#E3AA3F; --c-teal:#4FC4BE; --c-slate:#9DABA5;
    color-scheme:dark;
  }
}

*{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--paper);background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd{margin:0}
.wrap{width:100%;max-width:1040px;margin-inline:auto;padding-inline:16px}
.muted{color:var(--ink-2);font-weight:500}

/* ---------- header & tabs ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:10px;min-height:54px}
.brand{display:flex;align-items:center;gap:9px;font:400 21px/1 var(--f-display);white-space:nowrap;min-width:0}
.sync{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.sync.off{color:var(--sun);font-weight:600}
.gear{flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
.tab{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--pine)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--pine)}
.tab:focus-visible{outline:2px solid var(--pine);outline-offset:-5px;border-radius:10px}
@media (min-width:900px){
  .tabs{position:static;display:flex;gap:2px;border:0;background:none;padding:0;margin-left:auto}
  .sync{margin-left:6px;min-width:58px;text-align:right}
  .tab{flex-direction:row;height:38px;padding:0 14px;border-radius:10px;font-size:14px;gap:7px;color:var(--ink-2)}
  .tab svg{width:18px;height:18px}
  .tab:hover{background:var(--sheet-2)}
  .tab[aria-current="page"]{background:var(--pine-wash);color:var(--pine)}
  .tab[aria-current="page"]::before{display:none}
}
main{padding-block:2px calc(150px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){main{padding-block:6px 110px}}
body.gated .tabs,body.gated .fab,body.gated .gear{display:none!important}
body.gated main{padding-block:8px calc(40px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:22px;padding-top:16px}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.view-head h1{font:400 30px/1.1 var(--f-display);text-wrap:balance}

/* ---------- shared pieces ---------- */
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;flex-wrap:wrap}
.sec-head h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;text-wrap:balance}
.head-acts{display:flex;gap:6px;flex-wrap:wrap}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--sun);color:var(--sheet);font-size:12px;font-weight:700}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}
.empty{padding:18px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;color:var(--ink-2)}
.empty-acts{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:13px;color:var(--ink-2)}
.cap{font-size:12px;color:var(--ink-3)}
.dd{font-size:11.5px;font-weight:700;color:var(--pine);font-variant-numeric:tabular-nums}
.dd.late{color:var(--sun)}
.hol-tag{display:inline-block;color:var(--sun);font-weight:600;font-size:13px;line-height:1.5;border:1px solid currentColor;border-radius:999px;padding:0 9px;white-space:nowrap}
.hol-tag.sm{font-size:12px;padding:0 7px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-size:14px;font-weight:600;line-height:1.2;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sheet-2)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--pine);padding:0 8px}
.btn.ghost:hover{background:var(--pine-wash)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.ghost.sm{padding:0 7px}
.btn.wide{width:100%;min-height:48px;font-size:15px}
.btn[disabled]{opacity:.6;cursor:default;filter:none}
.btn svg,.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:focus-visible,.icon-btn:focus-visible,.link:focus-visible,.lchip:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;flex:none;padding:0}
.icon-btn:hover{background:var(--sheet-2)}
.icon-btn[aria-current="page"]{background:var(--pine-wash);border-color:transparent;color:var(--pine)}
.icon-btn.sm{width:30px;height:30px;border-color:transparent;background:none;color:var(--ink-3)}
.icon-btn.sm svg{width:14px;height:14px}
.link{all:unset;color:var(--pine);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lchip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;line-height:1.4;color:var(--ink-2);cursor:pointer}
.lchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

.meter{height:7px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--pine));border-radius:inherit;min-width:0}
.meter.lg{height:11px}

.banner{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:12px;border:1px dashed var(--ink-3);background:var(--sheet);font-size:14px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.banner p{flex:1 1 260px;min-width:0}
.banner .acts{display:flex;gap:6px;flex-wrap:wrap}
.banner.warn{border:1px solid var(--sun)}
.banner.install{border:1px solid var(--pine);border-style:solid}
.view>.banner{margin-top:0}

/* stamp (도장) */
.stamp{--c:var(--c-pine);flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--c);border:1.6px solid var(--c);box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3.2px var(--c);background:var(--sheet);background:color-mix(in srgb,var(--c) 9%,var(--sheet));font:400 14px/1 var(--f-display);transform:rotate(var(--rot,-8deg));user-select:none}
.stamp.two{font-size:10.5px;letter-spacing:-.06em}
.stamp.sm{width:19px;height:19px;font-size:10.5px;border-width:1.2px;box-shadow:inset 0 0 0 1.4px var(--sheet),inset 0 0 0 2.4px var(--c)}
.stamp.sm.two{font-size:7.5px}
.stamp.lg{width:38px;height:38px;font-size:19px;border-width:2px;box-shadow:inset 0 0 0 2.6px var(--sheet),inset 0 0 0 4.2px var(--c)}
.stamp.lg.two{font-size:13px}
.stamp.xl{width:64px;height:64px;font-size:32px;border-width:2.6px;box-shadow:inset 0 0 0 3.4px var(--sheet),inset 0 0 0 5.6px var(--c)}
.stamp.press{animation:press .46s cubic-bezier(.2,.9,.25,1) both}
@keyframes press{0%{transform:scale(1.9) rotate(calc(var(--rot,-8deg) - 18deg));opacity:0}55%{transform:scale(.9) rotate(var(--rot,-8deg));opacity:1}100%{transform:scale(1) rotate(var(--rot,-8deg));opacity:1}}

/* checkbox */
.check{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;flex:none;cursor:pointer}
.check input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.check span{pointer-events:none;width:22px;height:22px;border:1.6px solid var(--ink-3);border-radius:7px;background:var(--sheet);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check input:checked+span{background:var(--pine);border-color:var(--pine)}
.check input:checked+span::after{content:"";width:11px;height:6px;border-left:2.2px solid var(--on-pine);border-bottom:2.2px solid var(--on-pine);transform:translateY(-1.5px) rotate(-45deg)}
.check input:focus-visible+span{outline:2px solid var(--pine);outline-offset:2px}

/* list rows */
.rows{list-style:none;margin:0;padding:2px 0;overflow:hidden}
.row{position:relative;display:flex;align-items:center;min-width:0}
.row+.row{border-top:1px solid var(--rule)}
.row::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--ink-3))}
.row:hover{background:var(--sheet-2)}
.row-btn{all:unset;box-sizing:border-box;flex:1;min-width:0;display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;padding:10px 6px 10px 16px;min-height:58px;cursor:pointer}
.row-btn:focus-visible{outline:2px solid var(--pine);outline-offset:-3px;border-radius:10px}
.row>.check,.row>.row-end{margin-right:10px}
.row-end{width:34px;display:grid;place-items:center;flex:none}
.row-time{font-size:13px;line-height:1.3;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-start}
.row-time b{font-size:15px;color:var(--ink);font-weight:600}
.row-time small{font-size:11px;color:var(--ink-3)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.row-sub .kind{color:var(--c);font-weight:700}
.row.is-done .row-title{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}

/* ---------- today ---------- */
.today-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.eyebrow{width:100%;font-size:13px;font-weight:600;color:var(--ink-2)}
.today-date{font:400 clamp(32px,9vw,46px)/1.05 var(--f-display);letter-spacing:-.01em}
.today-date span{font-size:.5em;color:var(--ink-2);margin-left:8px;vertical-align:.15em}
.today-grid{display:grid;gap:22px}
.today-grid>.col{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:900px){.today-grid{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);align-items:start}}

.up{padding:2px 0}
.up-day{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:11px 14px 11px 16px}
.up-day+.up-day{border-top:1px solid var(--rule)}
.up-date{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.up-date b{font:400 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.up-date span{font-size:12px;color:var(--ink-2)}
.up-date.sun b{color:var(--sun)} .up-date.sat b{color:var(--sat)}
.up-date .dd{margin-top:3px}
.up-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.up-item{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:8px;width:100%;padding:4px 6px;margin-left:-6px;border-radius:8px;cursor:pointer;min-width:0}
.up-item:hover{background:var(--sheet-2)}
.up-item:focus-visible{outline:2px solid var(--pine);outline-offset:-2px}
.up-item .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;align-self:center}
.up-item .dot.sq{border-radius:2px;background:none;border:1.5px solid var(--c)}
.up-item .dot.dia{border-radius:1px;transform:rotate(45deg)}
.up-item .t{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}
.up-item .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}

.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.tile{padding:14px;display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.tile-top{display:flex;align-items:center;gap:9px;min-width:0;width:100%}
.tile-top h3{font-size:15px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.tile-num{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.tile-num b{font:400 42px/1 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums}
.tile-num span{font-weight:700;color:var(--ink-2)}
.tile-num small{font-size:13px;color:var(--ink-3);margin-left:2px}
.tile .meter{width:100%}
.tile-sub{font-size:13px;color:var(--ink-2)}

/* ---------- projects ---------- */
.pj-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.pj-card{padding:14px 16px;display:flex;flex-direction:column;gap:9px;cursor:pointer;min-width:0}
.pj-card:hover{border-color:var(--ink-3)}
.pj-card:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.pj-top{display:flex;align-items:center;gap:9px;min-width:0}
.pj-top h3{font-size:16px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.pj-dot{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none;transform:rotate(45deg)}
.pill{flex:none;font-size:12px;font-weight:700;line-height:1.5;padding:0 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pj-top .pill{margin-left:auto}
.st-active{color:var(--pine)} .st-plan{color:var(--ink-2)} .st-hold{color:var(--c-amber)} .st-done{color:var(--ink-3)}
.pj-prog{display:flex;align-items:center;gap:10px}
.pj-prog .meter{flex:1}
.pj-prog b{font:400 20px/1 var(--f-display);color:var(--c);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.pj-meta,.pj-next{font-size:13px;color:var(--ink-2)}
.pj-next{color:var(--ink)}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px;border-radius:10px;-webkit-tap-highlight-color:transparent}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:"";width:7px;height:7px;margin:0 2px 0 4px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .15s}
.fold[open] summary::before{transform:rotate(45deg)}
.fold summary:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.fold summary h2{font-size:16px;font-weight:700}
.fold.sec{display:block}
.fold>.pj-list,.fold>.pj-sort{margin-top:8px}
.fold:not([open]) summary .muted::after{content:" · 접힘";font-weight:500;color:var(--ink-3)}
.head-acts{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
@media (max-width:374px){.nh{display:none}}

/* 순서 바꾸기 */
.sort-hint{display:flex;gap:8px;align-items:flex-start;background:var(--pine-wash);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.sort-hint svg{flex:none;width:18px;height:18px;margin-top:1px;fill:var(--pine)}
.pj-sort{list-style:none;padding:0;max-width:720px}
.srow{position:relative;display:flex;align-items:center;gap:4px;min-height:58px;padding:5px 8px 5px 2px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .18s ease}
.srow+.srow{border-top:1px solid var(--rule)}
.srow:first-child{border-radius:13px 13px 0 0}
.srow:last-child{border-radius:0 0 13px 13px}
.srow:only-child{border-radius:13px}
.grip{display:grid;place-items:center;width:44px;height:48px;flex:none;color:var(--ink-3);cursor:grab;touch-action:none;border-radius:10px}
.grip:hover{color:var(--ink-2);background:var(--sheet-2)}
.grip svg{width:20px;height:20px;fill:currentColor}
.grip.off{visibility:hidden}
.srow .pj-dot{margin-right:6px}
.srow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.srow-main b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow-main small{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.srow .mv{display:flex;gap:4px;flex:none}
.mvb{width:40px;height:40px;color:var(--ink-2)}
.mvb:disabled{opacity:.3;cursor:default;background:var(--sheet)}
.pj-sort.dragging,.pj-sort.dragging .grip{cursor:grabbing}
.srow.lift{z-index:3;transition:none;background:var(--sheet);border-radius:12px;border-top-color:transparent;box-shadow:0 0 0 1px var(--rule),0 14px 28px -10px rgba(0,0,0,.4)}
.srow.moved{animation:moved .9s ease-out}
@keyframes moved{0%,35%{background-color:var(--pine-wash)}100%{background-color:transparent}}

.pd{display:flex;flex-direction:column;gap:20px}
.back{align-self:flex-start;margin-left:-6px}
.pd-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:start}
.pd-title{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.pd-title h1{font:400 clamp(26px,7vw,34px)/1.15 var(--f-display);overflow-wrap:anywhere;text-wrap:balance}
.pd-title .pj-dot{width:13px;height:13px}
.pd-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13.5px;color:var(--ink-2)}
.pd-edit{grid-column:2;grid-row:1}
.pd-prog{padding:16px;display:flex;gap:16px;align-items:center}
.pd-pct{display:flex;align-items:baseline;flex:none}
.pd-pct b{font:400 56px/0.9 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums}
.pd-pct span{font:400 22px/1 var(--f-display);color:var(--ink-2);margin-left:2px}
.pd-prog-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.pd-acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:420px){.pd-prog{flex-direction:column;align-items:stretch}}
.tasks{list-style:none;margin:0;padding:2px 0}
.task{display:flex;align-items:flex-start;gap:4px;padding:6px 12px 6px 8px}
.task+.task{border-top:1px solid var(--rule)}
.task-btn{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:6px 4px;border-radius:8px;cursor:pointer}
.task-btn:focus-visible{outline:2px solid var(--pine);outline-offset:-2px}
.task-text{font-weight:500;overflow-wrap:anywhere}
.task.is-done .task-text{text-decoration:line-through;color:var(--ink-3)}
.task-due{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.task-due.late{color:var(--sun);font-weight:600}
.task-add,.note-add{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"text text" "date btn";gap:8px;padding:12px;border-top:1px solid var(--rule)}
.task-add [name="text"],.note-add [name="text"]{grid-area:text}
.task-add [name="due"],.note-add [name="date"]{grid-area:date}
.task-add button,.note-add button{grid-area:btn;min-height:44px}
.note-add{border-top:0;border-bottom:1px solid var(--rule)}
.note-add:last-child{border-bottom:0}
@media (min-width:640px){
  .task-add{grid-template-columns:minmax(0,1fr) 170px auto;grid-template-areas:"text date btn"}
  .note-add{grid-template-columns:170px minmax(0,1fr) auto;grid-template-areas:"date text btn"}
}
.notes{list-style:none;margin:0;padding:2px 0}
.note{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:9px 8px 9px 16px;align-items:baseline}
.note+.note{border-top:1px solid var(--rule)}
.note time{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.note.status p{font-weight:700;color:var(--c)}
.memo{padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- calendar ---------- */
.cal-layout{display:grid;gap:22px}
@media (min-width:980px){.cal-layout{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);align-items:start}}
.cal-card{overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 10px 16px;flex-wrap:wrap}
.cal-title{display:flex;align-items:baseline;gap:8px;font-weight:400}
.cal-title b{font:400 36px/1 var(--f-display);font-variant-numeric:tabular-nums}
.cal-title span{font-size:14px;color:var(--ink-2);font-weight:600}
.cal-nav{display:flex;gap:6px;align-items:center}
.layers{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px 16px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule);background:var(--sheet-2)}
.wk span{font-size:12px;font-weight:600;text-align:center;padding:5px 0;color:var(--ink-2)}
.wk span:first-child{color:var(--sun)} .wk span:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule)}
.cd{all:unset;box-sizing:border-box;position:relative;min-width:0;min-height:80px;padding:4px 3px 5px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);cursor:pointer;background:var(--sheet);overflow:hidden}
.cd:nth-child(7n){border-right:0}
.cd:hover{background:var(--sheet-2)}
.cd.out{background:var(--sheet-2)}
.cd.out>*{opacity:.5}
.cd.sel{box-shadow:inset 0 0 0 2px var(--pine)}
.cd:focus-visible{outline:2px solid var(--pine);outline-offset:-4px}
.cd-top{display:flex;align-items:flex-start;gap:3px;min-height:22px;min-width:0}
.dn{font-size:13px;font-weight:600;line-height:21px;min-width:21px;padding:0 2px;text-align:center;border-radius:3px;font-variant-numeric:tabular-nums}
.cd.sun .dn,.cd.hol .dn{color:var(--sun)}
.cd.sat:not(.hol) .dn{color:var(--sat)}
.cd.today .dn{background:var(--hl);transform:rotate(-4deg)}
.hn{display:none;font-size:11px;color:var(--sun);line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.stamps{margin-left:auto;display:flex;flex:none;padding-top:1px}
.stamps .stamp+.stamp{margin-left:-7px}
.chips{display:flex;flex-direction:column;gap:2px;min-width:0}
.chip{display:block;font-size:10.5px;line-height:15px;padding:0 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--sheet-2);background:color-mix(in srgb,var(--c) 15%,var(--sheet));color:var(--ink);border-left:2px solid var(--c)}
.chip.done{text-decoration:line-through;opacity:.55}
.chip.task::before{content:"";display:inline-block;width:6px;height:6px;border:1.3px solid var(--c);border-radius:2px;margin-right:3px}
.chip.task.done::before{background:var(--c)}
.chip.due::before{content:"";display:inline-block;width:5px;height:5px;background:var(--c);transform:rotate(45deg);margin:0 4px 1px 1px}
.chip .ct{display:none}
.chips .chip:nth-child(n+3){display:none}
.more{font-size:10px;color:var(--ink-2);line-height:13px;padding-left:3px;font-weight:600}
.more.l{display:none}
@media (min-width:700px){
  .cd{min-height:112px;padding:6px 6px 6px}
  .chip{font-size:12px;line-height:18px;padding:0 5px}
  .chip .ct{display:inline;color:var(--ink-2);margin-right:4px;font-variant-numeric:tabular-nums}
  .chips .chip:nth-child(n+3){display:block}
  .chips .chip:nth-child(n+5){display:none}
  .more.s{display:none} .more.l{display:block}
  .hn{display:block}
  .stamp.sm{width:22px;height:22px;font-size:12px}
}
.cal-sum{display:flex;flex-wrap:wrap;gap:4px 16px;padding:11px 16px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.cal-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 16px 12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:0}
.cal-note{padding:0 16px 12px;font-size:12px;color:var(--ink-3)}

/* ---------- records ---------- */
.mnav{display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:6px}
.mnav b{flex:1;text-align:center;font:400 22px/1 var(--f-display)}
.tr-list{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));align-items:start}
.tr-card{padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.tr-head{display:flex;align-items:center;gap:12px;min-width:0}
.tr-name{min-width:0;flex:1}
.tr-name h2{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.tr-name p{font-size:13px;color:var(--ink-2)}
.tr-figs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 26px}
.big{display:flex;align-items:baseline;gap:5px}
.big b{font:400 60px/.85 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums}
.big span{font-weight:700;font-size:16px;color:var(--ink-2)}
.figs{display:flex;flex-wrap:wrap;gap:6px 22px}
.figs dt{font-size:12px;color:var(--ink-2)}
.figs dd{font-weight:600;font-variant-numeric:tabular-nums}
.goal{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.goal .meter{flex:1}
.tr-acts{display:flex;gap:8px;flex-wrap:wrap}
.tr-sec{display:flex;flex-direction:column;gap:8px}
.tr-sec h3{font-size:13px;font-weight:700;color:var(--ink-2)}
.att{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.att-wd{font-size:11px;text-align:center;color:var(--ink-3);font-weight:600}
.att-wd.sun{color:var(--sun)} .att-wd.sat{color:var(--sat)}
.att-cell{all:unset;box-sizing:border-box;position:relative;height:44px;border-radius:8px;background:var(--sheet-2);display:grid;place-items:center;cursor:pointer;min-width:0}
.att-cell:hover{box-shadow:inset 0 0 0 1px var(--rule)}
.att-cell:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
.att-cell.blank{background:none;cursor:default}
.att-cell.future{opacity:.5}
.att-dn{position:absolute;top:3px;left:5px;font-size:10.5px;line-height:1.2;color:var(--ink-3);font-variant-numeric:tabular-nums}
.att-cell.sun .att-dn{color:var(--sun)} .att-cell.sat .att-dn{color:var(--sat)}
.att-cell.today .att-dn{background:var(--hl);color:var(--ink);border-radius:3px;padding:0 2px;left:3px}
.att-q{position:absolute;right:4px;bottom:2px;font-size:10.5px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.bars-wrap{display:flex;flex-direction:column;gap:6px}
.bars{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding-top:16px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.btrack{position:relative;width:100%;height:64px;display:flex;align-items:flex-end;justify-content:center}
.bfill{display:block;width:min(30px,70%);border-radius:5px 5px 2px 2px;background:var(--sheet-2);background:color-mix(in srgb,var(--c) 32%,var(--sheet))}
.bcol.cur .bfill{background:var(--c)}
.bval{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;font-weight:700;line-height:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bcol.cur .bval{color:var(--ink)}
.blab{font-size:11.5px;line-height:16px;color:var(--ink-2)}
.bcol.cur .blab{color:var(--ink);font-weight:700}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-3);pointer-events:none}
.loglist{border-top:1px solid var(--rule);margin:0 -16px -16px;padding:0}
.loglist summary{cursor:pointer;padding:12px 16px;font-size:14px;font-weight:600;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px}
.loglist summary::-webkit-details-marker{display:none}
.loglist summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .15s}
.loglist[open] summary::before{transform:rotate(45deg)}
.loglist .rows{border-top:1px solid var(--rule);border-radius:0 0 14px 14px}
.pad{padding:0 16px 14px}

/* ---------- monthly routines ---------- */
.rt-ic svg{width:13px;height:13px;fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px;margin-right:5px}
.row-sub .shift{color:var(--ink-3)}
.rt-sum{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rt-sum-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rt-sum .eyebrow{width:auto}
.money{display:flex;align-items:baseline;gap:4px}
.money b{font:400 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.money span{font-weight:700;color:var(--ink-2)}
.rt-count{display:flex;align-items:baseline;gap:5px}
.rt-count b{font:400 30px/1 var(--f-display);color:var(--pine);font-variant-numeric:tabular-nums}
.rt-count span{font-size:13px;color:var(--ink-2);font-weight:600}
.rt-mini{padding:14px 16px;display:flex;flex-direction:column;gap:9px;cursor:pointer;min-width:0}
.rt-mini:hover{border-color:var(--ink-3)}
.rt-mini:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.rt-mini-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rt-next{font-size:13.5px;overflow-wrap:anywhere}
.rt-preview{font-size:13.5px;color:var(--ink-2);background:var(--sheet-2);border-radius:10px;padding:9px 12px}
.rt-preview b{color:var(--ink)}
.up-item .dot.ring{background:none;border:2px solid var(--c)}
.chip.rt::before{content:"↻";margin-right:3px;font-weight:700;color:var(--c)}
.legend .lg-rt::before{content:"↻";margin-right:4px;font-weight:700}

/* ---------- settings & login ---------- */
.set-list{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.set-card{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.set-card h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.set-card p{overflow-wrap:anywhere}
.set-acts{display:flex;flex-wrap:wrap;gap:8px}
.kv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.kv li{display:flex;justify-content:space-between;gap:12px}
.kv span{color:var(--ink-2)}
.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
.auth{max-width:440px;width:100%;margin:12px auto 0;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.auth h1{font:400 28px/1.15 var(--f-display);text-wrap:balance}
.auth form{display:flex;flex-direction:column;gap:14px}
.form-ok{color:var(--pine);font-size:13.5px;font-weight:600}
.auth-links{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.auth-alt{border-top:1px dashed var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:8px}

/* ---------- sheet (dialog) ---------- */
.sheet-dlg{padding:0;border:0;background:var(--sheet);color:var(--ink);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;margin:auto auto 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.35);overflow:hidden}
.sheet-dlg::backdrop{background:rgba(12,18,15,.5)}
.sheet-dlg[open]{animation:sheet-up .22s ease-out}
@keyframes sheet-up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width:640px){.sheet-dlg{margin:auto;border-radius:18px;max-height:min(88vh,780px)}}
.sheet{display:flex;flex-direction:column;max-height:92vh;max-height:92dvh}
@media (min-width:640px){.sheet{max-height:min(88vh,780px)}}
.sheet-head{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 12px 10px 18px}
.sheet-head h2{font-size:18px;font-weight:700}
.sheet-head p{font-size:13px;color:var(--ink-2);margin-top:2px}
.grab{position:absolute;top:7px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:9px;background:var(--rule)}
@media (min-width:640px){.grab{display:none}}
.sheet-body{overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:15px;flex:1;min-height:0}
.sheet-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);background:var(--sheet)}
.foot-main{display:flex;gap:8px;margin-left:auto}
.del-zone{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.del-q{font-size:13px;font-weight:600;color:var(--danger)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.lab{font-size:13px;font-weight:600;color:var(--ink-2)}
.lab small{font-weight:400;color:var(--ink-3)}
.field input:not([type="radio"]):not([type="checkbox"]),.field select,.field textarea,.task-add input,.note-add input{width:100%;min-width:0;font-size:16px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:9px 12px;min-height:44px}
.field textarea{resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,.task-add input:focus,.note-add input:focus{outline:2px solid var(--pine);outline-offset:-1px;border-color:var(--pine)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.suffix{position:relative;display:block}
.suffix input{padding-right:52px!important}
.suffix i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:14px;color:var(--ink-2);pointer-events:none}
.field-check{display:flex;align-items:center;gap:6px;font-weight:600;cursor:pointer}
.form-err{color:var(--danger);font-size:13.5px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--rule);border-radius:999px;font-size:14px;font-weight:600;background:var(--sheet);cursor:pointer}
.seg input:checked+span{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--pine);outline-offset:2px}
.seg .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{position:relative;display:block}
.swatches input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.swatches span{display:block;width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid var(--sheet);box-shadow:0 0 0 1px var(--rule);cursor:pointer}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--pine);outline-offset:3px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--rule);background:var(--sheet-2);font-size:20px;line-height:1;color:var(--ink);cursor:pointer}
.stepper button:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
#lg-qty{width:96px;flex:none;text-align:center;font-weight:700}
.stepper .unit{font-weight:700;color:var(--ink-2)}
.quick-q{display:flex;gap:6px;flex-wrap:wrap}
.mark-row{display:flex;align-items:center;gap:12px}
.mark-row input{max-width:120px}
.choose{display:grid;gap:10px}
.choose button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:46px minmax(0,1fr);gap:2px 12px;align-items:center;padding:14px;border:1px solid var(--rule);border-radius:14px;cursor:pointer;background:var(--sheet)}
.choose button:hover{background:var(--sheet-2)}
.choose button:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.choose .ic{grid-row:1/3;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--pine-wash);color:var(--pine)}
.choose .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.choose b{font-size:16px}
.choose span:last-child{font-size:13px;color:var(--ink-2)}

/* ---------- fab & toast ---------- */
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:44;width:56px;height:56px;border-radius:18px;border:0;background:var(--pine);color:var(--on-pine);box-shadow:0 12px 26px -10px rgba(0,0,0,.45);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round}
.fab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (min-width:900px){.fab{bottom:26px;right:max(24px,calc(50% - 496px))}}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--sheet);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.toast.err{background:var(--danger);color:var(--sheet)}
.toast button{all:unset;color:var(--hl);font-weight:700;cursor:pointer;padding:4px 8px;border-radius:6px;white-space:nowrap}
.toast.err button{color:var(--sheet)}

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const ymOf = s => s.slice(0, 7);

const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };

const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

/* 공휴일: 2026·2027년 (대체공휴일·선거일 포함) */
const HOL = {

  '2026-09-25': '추석', '2026-09-26': '추석 연휴', '2026-10-03': '개천절', '2026-10-05': '대체공휴일',

};

const curY = () => new Date().getFullYear();
function fmtMD(s) { const d = pd(s); return `${d.getFullYear() !== curY() ? d.getFullYear() + '년 ' : ''}${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; }
function fmtDot(s) { const d = pd(s); return `${d.getFullYear() !== curY() ? String(d.getFullYear()).slice(2) + '.' : ''}${d.getMonth() + 1}.${pad(d.getDate())} ${WD[d.getDay()]}`; }
function fmtYM(ym) { const [y, m] = ym.split('-').map(Number); return `${y}년 ${m}월`; }
function fmtTime(t) { const [h, m] = t.split(':').map(Number); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${pad(m)}`; }
function timeHTML(t) { const [h, m] = t.split(':').map(Number); return `<small>${h < 12 ? '오전' : '오후'}</small><b>${h % 12 || 12}:${pad(m)}</b>`; }
function dday(s) { const n = diff(today(), s); return n === 0 ? 'D-DAY' : n > 0 ? `D-${n}` : `D+${-n}`; }
const qtyText = (q, unit) => `${fq(q)}${unit}`;
function rot(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (Math.abs(h) % 21) - 14; }
function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* 진동 없음 */ } }

/* ================= 설정값 ================= */
function loadPrefs() { try { return JSON.parse(localStorage.getItem(LS_PREFS) || '{}') || {}; } catch (e) { return {}; } }
const P = Object.assign({ layers: { ev: true, rt: true, log: true, proj: true }, mode: '', installHide: false, migrateHide: false }, loadPrefs());
P.layers = Object.assign({ ev: true, rt: true, log: true, proj: true }, P.layers || {});
/* 프로젝트 묶음 펼침 상태 (이 기기에만 기억) */
P.pjOpen = Object.assign({ active: true, plan: true, hold: true, done: false }, objOr(P.pjOpen));
function savePrefs() { try { localStorage.setItem(LS_PREFS, JSON.stringify(P)); } catch (e) { /* 저장 안 돼도 괜찮음 */ } }

/* config.js 에 붙여 넣은 Firebase 설정 읽기 (앞뒤에 다른 줄이 있어도 괜찮음) */
function parseConfig(text) {
  if (typeof text !== 'string') return null;
  const out = {};
  const re = /\b(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)\b["']?\s*:\s*["'`]([^"'`\s]+)["'`]/g;
  let m;
  while ((m = re.exec(text))) out[m[1]] = m[2];
  if (!out.apiKey || !out.projectId || !out.appId) return null;
  if (!out.authDomain) out.authDomain = out.projectId + '.firebaseapp.com';
  return out;
}
const CFG_TEXT = typeof window.FIREBASE_CONFIG_TEXT === 'string' ? window.FIREBASE_CONFIG_TEXT : '';
const CFG = parseConfig(CFG_TEXT);
const CFG_BROKEN = !CFG && /apiKey/.test(CFG_TEXT);

function normTracker(id, r) {
  const name = str(r.name, 40).trim() || '이름 없는 항목';

  return { id, name, unit, rate: Math.max(0, num(r.rate)), goal: Math.max(0, num(r.goal)),
    color: PALETTE.includes(r.color) ? r.color : 'pine',
    mark: Array.from(str(r.mark, 8).trim()).slice(0, 2).join('') || firstChar(name),
    order: num(r.order), createdAt: num(r.createdAt) };
}
function normProject(id, r) {
  const tasks = Array.isArray(r.tasks) ? r.tasks.filter(t => t && typeof t === 'object').map((t, i) => ({ id: str(t.id, 60) || 'k' + i, text: str(t.text, 120) || '(내용 없음)', done: !!t.done, due: isDate(t.due) ? t.due : '', doneAt: isDate(t.doneAt) ? t.doneAt : '' })) : [];
  const notes = Array.isArray(r.notes) ? r.notes.filter(n => n && typeof n === 'object').map((n, i) => ({ id: str(n.id, 60) || 'n' + i, date: isDate(n.date) ? n.date : '', text: str(n.text, 500), kind: n.kind === 'status' ? 'status' : '' })) : [];
  return { id, name: str(r.name, 60).trim() || '이름 없는 프로젝트', status: STATUS[r.status] ? r.status : 'plan',
    start: isDate(r.start) ? r.start : '', due: isDate(r.due) ? r.due : '', color: PALETTE.includes(r.color) ? r.color : 'blue',
    memo: str(r.memo, 1000), tasks, notes, order: num(r.order), createdAt: num(r.createdAt), updatedAt: num(r.updatedAt) };
}
/* 프로젝트 순서: 직접 정한 순서(order) → (순서를 정한 적 없는 옛 기록은) 목표일 → 만든 순서 */
const pjCmp = (a, b) => a.order - b.order || ((a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0) || a.createdAt - b.createdAt || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

/* 루틴이 그 달에 실제로 돌아오는 날 (짧은 달은 말일로, 주말·공휴일은 설정대로 미루거나 당김) */
const isOff = d => { const w = pd(d).getDay(); return w === 0 || w === 6 || !!HOL[d]; };

function routineOcc(r, ym) {

/* 화면용 색인 */
let D = null;
function derive() {
  const evByDate = new Map(), logByDate = new Map(), taskByDate = new Map(), dueByDate = new Map(), startByDate = new Map(), tot = new Map(), evByProj = new Map();
  const push = (mp, k, v) => { const a = mp.get(k); if (a) a.push(v); else mp.set(k, [v]); };
  for (const mo of S.months.values()) {
    for (const e of mo.events) { push(evByDate, e.date, e); if (e.projectId) push(evByProj, e.projectId, e); }
    for (const l of mo.logs) {
      push(logByDate, l.date, l);
      const k = l.trackerId + '|' + ymOf(l.date);
      let o = tot.get(k); if (!o) tot.set(k, o = { qty: 0, pay: 0, days: new Set() });
      o.qty += l.qty; o.pay += l.pay; o.days.add(l.date);
    }
  }
  for (const p of S.projects) {
    if (p.due && p.status !== 'done') push(dueByDate, p.due, p);
    if (p.start && p.status !== 'plan') push(startByDate, p.start, p);
    for (const t of p.tasks) if (t.due) push(taskByDate, t.due, { p, t });
  }
  const rtByDate = new Map();
  if (S.routines.length) {
    const last = addMonths(S.range.to, 1);
    for (let ym = addMonths(S.range.from, -1); ym <= last; ym = addMonths(ym, 1))
      for (const r of S.routines) { const o = routineOcc(r, ym); if (o) push(rtByDate, o.date, o); }
  }
  return { evByDate, logByDate, taskByDate, dueByDate, startByDate, rtByDate, tot, evByProj,
    trMap: new Map(S.trackers.map(t => [t.id, t])), pjMap: new Map(S.projects.map(p => [p.id, p])) };
}
const sortEv = arr => arr.slice().sort((a, b) => (a.time || '') < (b.time || '') ? -1 : (a.time || '') > (b.time || '') ? 1 : a.createdAt - b.createdAt);
function prog(p) { const total = p.tasks.length, done = p.tasks.filter(t => t.done).length; return { total, done, pct: total ? Math.round(done / total * 100) : (p.status === 'done' ? 100 : 0) }; }

/* 하루치 항목 */
function dayItems(date, opt = {}) {
  const out = [];
  if (!opt.noRt) for (const o of D.rtByDate.get(date) || []) { if (opt.skipDone && o.done) continue; out.push({ k: 'rt', o, s: '00' }); }
  for (const e of D.evByDate.get(date) || []) { if (opt.skipDone && e.done) continue; out.push({ k: 'ev', e, s: e.time ? '1' + e.time : '0d' }); }
  if (!opt.noProj) {
    for (const p of D.startByDate.get(date) || []) out.push({ k: 'start', p, s: '0a' });
    for (const p of D.dueByDate.get(date) || []) out.push({ k: 'due', p, s: '0b' });
    for (const x of D.taskByDate.get(date) || []) { if (opt.skipDone && x.t.done) continue; out.push({ k: 'task', p: x.p, t: x.t, s: '0c' }); }
  }
  if (!opt.noLogs) for (const l of D.logByDate.get(date) || []) { if (D.trMap.has(l.trackerId)) out.push({ k: 'log', l, s: '2' }); }

  for (const p of S.projects) if (p.status !== 'done') for (const tk of p.tasks) if (!tk.done && tk.due && tk.due < t) out.push({ k: 'task', p, t: tk, d: tk.due });

function upcomingHTML(t) {

function projCard(p) {

  const cols = ms.map((x, i) => { const v = vals[i], h = Math.round(v / max * H); return `<div class="bcol${i === 5 ? ' cur' : ''}"><div class="btrack">${v ? `<span class="bval" style="bottom:${h + 2}px">${fq(v)}</span>` : ''}<span class="bfill" style="height:${v ? Math.max(3, h) : 0}px"></span></div><span class="blab">${+x.slice(5)}월</span></div>`; }).join('');
  const goal = tr.goal ? `<span class="goal-line" style="bottom:${20 + Math.round(tr.goal / max * H)}px" aria-hidden="true"></span>` : '';
  return `<div class="bars-wrap"><div class="bars" role="img" aria-label="${esc(label)}">${cols}${goal}</div>${tr.goal ? `<p class="cap">점선은 한 달 목표 ${qtyText(tr.goal, tr.unit)}</p>` : ''}</div>`;
}
function logRow(l, tr) {
  const dt = pd(l.date);
  return `<li class="row" style="--c:var(--c-${tr.color})"><button type="button" class="row-btn" data-act="open-log" data-id="${l.id}" data-ym="${l.ym}"><span class="row-time"><b>${dt.getMonth() + 1}.${pad(dt.getDate())}</b>${WD[dt.getDay()]}요일</span><span class="row-main"><span class="row-title">${qtyText(l.qty, tr.unit)}${l.pay ? ` · ${won(l.pay)}` : ''}</span>${l.memo ? `<span class="row-sub">${esc(l.memo)}</span>` : ''}</span></button><span class="row-end">${stamp(tr, l.date + '|' + tr.id, 'sm')}</span></li>`;
}

/* ----- 프로젝트 ----- */
function viewProj() {
  if (S.ui.proj) { const p = pjById(S.ui.proj); if (p) return projDetail(p); if (S.phase === 'ready') S.ui.proj = null; else return loadingCard(); }
  const ready = S.phase === 'ready', w = canWrite();
  const groups = PJ_GROUPS.map(([s, lab]) => [s, lab, ready ? pjOf(s) : []]).filter(g => g[2].length);
  const canSort = w && groups.some(g => g[2].length > 1);
  if (S.ui.pjSort && ready && !canSort) S.ui.pjSort = false; /* 다른 기기에서 지워 옮길 게 없어진 경우 */
  const sorting = S.ui.pjSort && canSort;
  const btns = sorting ? `<button type="button" class="btn sm primary" data-act="pj-sort-done">${ICON.check}완료</button>`
    : w ? `<div class="head-acts">${canSort ? `<button type="button" class="btn ghost sm" data-act="pj-sort" aria-label="순서 바꾸기">${ICON.sort}순서<span class="nh">바꾸기</span></button>` : ''}<button type="button" class="btn sm" data-act="new-project">${ICON.plus}새 프로젝트</button></div>` : '';
  const head = `<div class="view-head"><h1>프로젝트</h1>${btns}</div>`;
  if (!ready) return head + loadingCard();
  if (!S.projects.length) return head + emptyCard('이사 준비, 자격증 공부처럼 여러 단계로 나뉘는 일을 프로젝트로 만들어 보세요. 단계를 체크할 때마다 진행률이 올라가요.', '새 프로젝트', 'new-project');
  let h = head;
  if (sorting) h += `<p class="sort-hint">${ICON.grip}<span>왼쪽 손잡이를 잡고 위아래로 끌거나, 오른쪽 화살표 버튼으로 한 칸씩 옮기세요. 같은 묶음 안에서만 움직이고, 바꾼 순서는 ${S.store && S.store.kind === 'cloud' ? '폰·PC에 함께' : '바로'} 저장돼요.</span></p>`;
  for (const [s, lab, arr] of groups) {
    h += `<details class="sec fold pj-grp" data-tog="pj-${s}"${P.pjOpen[s] ? ' open' : ''}><summary><h2>${lab} <span class="muted">${arr.length}</span></h2></summary>${sorting ? sortList(s, lab, arr) : `<div class="pj-list">${arr.map(projCard).join('')}</div>`}</details>`;
  }
  return h;
}
/* 순서 바꾸기 화면의 한 줄 */
function sortList(s, lab, arr) {
  const mv = S.ui.pjMoved && Date.now() - S.ui.pjMoved.t < 900 ? S.ui.pjMoved.id : '';
  return `<ol class="card pj-sort" data-grp="${s}" aria-label="${lab} 프로젝트 순서">${arr.map((p, i) => {
    const { pct, total } = prog(p), solo = arr.length < 2;
    return `<li class="srow${p.id === mv ? ' moved' : ''}" data-id="${p.id}" style="--c:var(--c-${p.color})">
      <span class="grip${solo ? ' off' : ''}" aria-hidden="true" title="끌어서 옮기기">${ICON.grip}</span>
      <span class="pj-dot" aria-hidden="true"></span>
      <span class="srow-main"><b>${esc(p.name)}</b><small>${i + 1}번째${total ? ` · 진행 ${pct}%` : ''}</small></span>
      <span class="mv"><button type="button" class="icon-btn mvb" id="mv-u-${p.id}" data-act="pj-move" data-id="${p.id}" data-dir="-1" aria-label="${esc(p.name)} 위로"${i === 0 ? ' disabled' : ''}>${ICON.up}</button><button type="button" class="icon-btn mvb" id="mv-d-${p.id}" data-act="pj-move" data-id="${p.id}" data-dir="1" aria-label="${esc(p.name)} 아래로"${i === arr.length - 1 ? ' disabled' : ''}>${ICON.down}</button></span>
    </li>`;
  }).join('')}</ol>`;
}
function taskRow(p, tk) {
  const late = !tk.done && tk.due && tk.due < today();
  const due = tk.done ? (tk.doneAt ? `<span class="task-due">${fmtDot(tk.doneAt)} 마침</span>` : '') : tk.due ? `<span class="task-due${late ? ' late' : ''}">${fmtDot(tk.due)}까지 · ${dday(tk.due)}</span>` : '';
  return `<li class="task${tk.done ? ' is-done' : ''}">${chk('task', tk.done, `data-pid="${p.id}" data-tid="${tk.id}"`, `${tk.text} 마침`)}<button type="button" class="task-btn" data-act="open-task" data-pid="${p.id}" data-tid="${tk.id}"><span class="task-text">${esc(tk.text)}</span>${due}</button></li>`;
}
function projDetail(p) {
  const { pct, done, total } = prog(p), t = today(), w = canWrite(), dr = S.ui.drafts;
  const evs = (D.evByProj.get(p.id) || []).slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const notes = p.notes.map((n, i) => ({ ...n, i })).sort((a, b) => a.date === b.date ? b.i - a.i : (a.date < b.date ? 1 : -1));
  const bits = [];
  if (p.status === 'plan') bits.push(p.start ? `${fmtMD(p.start)} 시작 예정` : '아직 시작 전');
  else if (p.start) bits.push(`${fmtMD(p.start)} 시작${p.status !== 'done' && p.start <= t ? ` · ${diff(p.start, t) + 1}일째` : ''}`);
  if (p.due) bits.push(`목표 ${fmtMD(p.due)}${p.status !== 'done' ? ` <b class="dd${p.due < t ? ' late' : ''}">${dday(p.due)}</b>` : ''}`);
  const B = (s, lab, pri) => `<button type="button" class="btn${pri ? ' primary' : ''}" data-act="proj-status" data-id="${p.id}" data-s="${s}">${lab}</button>`;
  const btns = { plan: B('active', `${ICON.play}시작하기`, 1), active: B('hold', '보류') + B('done', '완료로 표시', 1), hold: B('active', '다시 진행', 1) + B('done', '완료로 표시'), done: B('active', '다시 열기') }[p.status];
  const allDone = total > 0 && done === total && p.status !== 'done';
  return `<div class="pd" style="--c:var(--c-${p.color})">
    <button type="button" class="btn ghost sm back" data-act="proj-back">${ICON.prev}프로젝트 목록</button>
    <header class="pd-head">
      <div class="pd-title"><span class="pj-dot" aria-hidden="true"></span><h1>${esc(p.name)}</h1></div>
      ${w ? `<button type="button" class="btn sm pd-edit" data-act="edit-project" data-id="${p.id}">수정</button>` : ''}
      <div class="pd-meta"><span class="pill st-${p.status}">${STATUS[p.status]}</span>${bits.map(b => `<span>${b}</span>`).join('')}</div>
    </header>
    <section class="card pd-prog">
      <div class="pd-pct"><b>${pct}</b><span>%</span></div>
      <div class="pd-prog-r">
        <div class="meter lg" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="진행률"><i style="width:${pct}%"></i></div>
        <p>${total ? `${total}단계 중 <b>${done}단계</b>를 마쳤어요.` : '단계를 추가하면 진행률이 자동으로 계산돼요.'}</p>
        ${allDone ? '<p class="hint">모든 단계를 마쳤어요. 완료로 표시할까요?</p>' : ''}
        ${w ? `<div class="pd-acts">${btns}</div>` : ''}
      </div>
    </section>
    <section class="sec"><div class="sec-head"><h2>단계</h2><span class="muted">${done}/${total}</span></div>
      <div class="card">
        ${total ? `<ul class="tasks">${p.tasks.map(tk => taskRow(p, tk)).join('')}</ul>` : ''}
        ${w ? `<form class="task-add" data-form="task-add" data-pid="${p.id}" novalidate>
          <input id="ta-text" name="text" maxlength="120" placeholder="다음 단계 (예: 견적 받기)" value="${esc(dr['ta-text'] || '')}" data-draft aria-label="새 단계 내용">
          <input id="ta-due" name="due" type="date" value="${esc(dr['ta-due'] || '')}" data-draft aria-label="기한 (선택)">
          <button type="submit" class="btn primary sm">단계 추가</button>
        </form>` : ''}
      </div>
    </section>
    <section class="sec"><div class="sec-head"><h2>연결된 일정</h2>${w ? `<button type="button" class="btn ghost sm" data-act="new-event" data-pid="${p.id}">${ICON.plus}일정</button>` : ''}</div>${evs.length ? `<ul class="card rows">${evs.map(e => rowHTML({ k: 'ev', e }, { showDate: true, neutral: true })).join('')}</ul>` : '<div class="card empty"><p>연결된 일정이 없어요. 일정을 추가할 때 이 프로젝트를 고르면 여기에 모여요.</p></div>'}</section>
    <section class="sec"><div class="sec-head"><h2>진행 메모</h2></div>
      <div class="card">
        ${w ? `<form class="note-add" data-form="note-add" data-pid="${p.id}" novalidate>
          <input id="na-date" name="date" type="date" value="${esc(dr['na-date'] || t)}" data-draft aria-label="날짜">
          <input id="na-text" name="text" maxlength="500" placeholder="오늘 진행한 일, 정한 것" value="${esc(dr['na-text'] || '')}" data-draft aria-label="메모 내용">
          <button type="submit" class="btn sm">남기기</button>
        </form>` : ''}
        ${notes.length ? `<ol class="notes">${notes.map(n => `<li class="note${n.kind === 'status' ? ' status' : ''}"><time datetime="${n.date}">${n.date ? fmtDot(n.date) : ''}</time><p>${esc(n.text)}</p>${w ? `<button type="button" class="icon-btn sm" data-act="del-note" data-pid="${p.id}" data-nid="${n.id}" aria-label="메모 지우기">${ICON.x}</button>` : '<span></span>'}</li>`).join('')}</ol>` : (w ? '' : '<p class="hint pad">메모가 없어요.</p>')}
      </div>
    </section>
    ${p.memo ? `<section class="sec"><div class="sec-head"><h2>메모</h2></div><div class="card memo">${esc(p.memo)}</div></section>` : ''}
  </div>`;
}

/* ----- 알림줄 ----- */

/* ================= 저장소 =================
   이 기기(localStorage) 또는 내 Firebase 계정(Firestore) — 둘 다 같은 모양으로 다룹니다. */

  try { const v = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); if (v && typeof v === 'object') return { trackers: objOr(v.trackers), projects: objOr(v.projects), routines: objOr(v.routines), months: objOr(v.months) }; } catch (e) { /* 손상된 값 */ }

  for (const m of Object.values(d.months)) n += Object.keys(objOr(m && m.events)).length + Object.keys(objOr(m && m.logs)).length;

    watchMonths: (from, to, next) => watch(() => new Map(Object.entries(data.months).filter(([k]) => k >= from && k <= to).map(([k, v]) => [k, clone(v)])), next),

function makeCloudStore(fb, userId) {

  const ref = (name, id) => F.doc(db, 'users', userId, name, id);
  const toMap = snap => { const m = new Map(); snap.docs.forEach(d => m.set(d.id, d.data())); return m; };
  return {
    kind: 'cloud', uid: userId,
    watchCol: (name, next, err) => F.onSnapshot(col(name), s => next(toMap(s)), err),
    watchMonths: (from, to, next, err) => F.onSnapshot(F.query(col('months'), F.where('ym', '>=', from), F.where('ym', '<=', to)), s => next(toMap(s)), err),
    putMonthItem: (ym, field, id, body) => F.setDoc(ref('months', ym), { ym, [field]: { [id]: body } }, { merge: true }),
    delMonthItems(ym, field, ids) { const p = {}; for (const id of ids) p[id] = F.deleteField(); return F.setDoc(ref('months', ym), { ym, [field]: p }, { merge: true }); },
    setDoc: (c, id, body) => F.setDoc(ref(c, id), body),
    updateDoc: (c, id, patch) => F.updateDoc(ref(c, id), patch),
    /* 여러 문서를 한 번에(같이 성공하거나 같이 실패) — 순서 바꾸기에 사용 */
    patchMany(c, patches) {

    importAll(d) {

      for (const [id, b] of Object.entries(d.projects)) ops.push(bt => bt.set(ref('projects', id), b));

    }
  };

/* 저장 — 화면에는 바로 반영하고, 저장은 뒤에서 (인터넷이 끊겨도 연결되면 자동으로 올라감) */

/* 한 묶음(진행 중·준비 중…)의 새 순서(ids)를 저장. 처음 바꿀 때 모든 프로젝트에 1,2,3… 번호를 매기고,

let FB = null, authUnsub = null;

      S.gate = false; S.wantLogin = false; S.authMode = 'login'; S.authErr = ''; S.authInfo = ''; S.ui.drafts['au-pw'] = '';
      if (!S.store || S.store.kind !== 'cloud' || S.store.uid !== user.uid) useStore(makeCloudStore(FB, user.uid));
      checkLocalLeftovers();
      if (fromGate && (S.ui.tab !== 'today' || S.ui.proj)) goTab('today');
      render();
    } else {
      S.user = null; S.authMode = 'login'; S.authErr = '';
      if (S.store && S.store.kind === 'cloud') { stopWatch(); S.store = null; }

function authMsg(e) {
  const code = (e && e.code) || '';
  if (code === 'auth/invalid-email') return '이메일 주소 형식을 확인해 주세요.';
  if (code === 'auth/missing-password') return '비밀번호를 입력해 주세요.';
  if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-login-credentials'].includes(code)) return '이메일 또는 비밀번호가 맞지 않아요. 처음이라면 ‘계정 만들기’를 눌러 주세요.';
  if (code === 'auth/email-already-in-use') return '이미 만든 계정이에요. 로그인 화면에서 로그인해 주세요.';
  if (code === 'auth/weak-password') return '비밀번호는 6자 이상으로 해 주세요.';
  if (code === 'auth/too-many-requests') return '시도가 너무 많았어요. 잠시 후 다시 해 주세요.';
  if (code === 'auth/network-request-failed') return '인터넷에 연결되어 있지 않아요. 연결을 확인해 주세요.';
  if (code === 'auth/operation-not-allowed') return 'Firebase에서 이메일/비밀번호 로그인이 꺼져 있어요. 설명서 3-2단계를 확인해 주세요.';

/* 순서 바꾸기 모드도 기록에 남겨서, 폰의 뒤로 버튼을 누르면 모드만 끝나도록 */

document.addEventListener('click', e => {
  if (e.target.closest('.check')) return;

/* ----- 끌어서 순서 바꾸기 (손잡이를 잡고 위아래로) ----- */
function dragMove() {
  const d = drag, sy = window.scrollY, me = d.boxes[d.from];
  const first = d.boxes[0], last = d.boxes[d.boxes.length - 1];
  const dy = Math.max(first.top - me.top, Math.min(last.top + last.h - (me.top + me.h), d.y + sy - d.startY));
  d.row.style.transform = `translateY(${dy}px)`;
  /* 위로 끌 때는 줄의 윗변이, 아래로 끌 때는 아랫변이 이웃 줄의 가운데를 넘으면 자리를 바꿈 */
  const top = me.top + dy, bot = top + me.h;
  let to = d.from;
  for (let i = d.from - 1; i >= 0; i--) { const b = d.boxes[i]; if (top < b.top + b.h / 2) to = i; else break; }
  for (let i = d.from + 1; i < d.boxes.length; i++) { const b = d.boxes[i]; if (bot > b.top + b.h / 2) to = i; else break; }
  if (to === d.to) return;
  d.to = to;
  d.rows.forEach((r, i) => {
    if (i === d.from) return;
    const s = d.from < to && i > d.from && i <= to ? -me.h : d.from > to && i >= to && i < d.from ? me.h : 0;
    r.style.transform = s ? `translateY(${s}px)` : '';
  });
  buzz();
}
/* 손가락이 화면 위·아래 가장자리에 가면 저절로 스크롤 (조금이라도 끈 뒤부터) */
function dragTick() {
  const d = drag; if (!d) return;
  const zone = 64, y = d.y;
  if (!d.moved && Math.abs(y - d.y0) > 8) d.moved = true;
  let v = 0;
  if (d.moved && y < d.topLim + zone) v = -Math.min(16, Math.ceil((d.topLim + zone - y) / 4));
  else if (d.moved && y > d.botLim - zone) v = Math.min(16, Math.ceil((y - (d.botLim - zone)) / 4));
  if (v) { const before = window.scrollY; window.scrollBy(0, v); if (window.scrollY !== before) dragMove(); }
  d.raf = requestAnimationFrame(dragTick);
}
function dragEnd(e, cancel) {
  const d = drag;
  if (!d || (e && e.pointerId !== d.pid)) return;
  drag = null;
  cancelAnimationFrame(d.raf);
  try { d.grip.releasePointerCapture(d.pid); } catch (x) { /* 이미 놓음 */ }
  d.list.classList.remove('dragging');
  if (!cancel && d.to !== d.from && canWrite()) {
    const ids = d.rows.map(r => r.dataset.id);
    ids.splice(d.from, 1); ids.splice(d.to, 0, d.id);
    S.ui.pjMoved = { id: d.id, t: Date.now() };
    if (reorderGroup(d.status, ids)) return; /* 새 순서로 다시 그려짐 */
  }
  d.rows.forEach(r => { r.style.transform = ''; });
  d.row.classList.remove('lift');
  if (d.dirty) render();
}
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest && e.target.closest('.grip');
  if (!grip || drag || grip.classList.contains('off') || (e.pointerType === 'mouse' && e.button !== 0) || !canWrite()) return;
  const row = grip.closest('.srow'), list = row && row.parentElement;
  if (!row || !list || !list.dataset.grp) return;
  e.preventDefault();
  const rows = [...list.children], sy = window.scrollY;
  const top = $('.top'), tabs = $('.tabs');
  const tabsFixed = tabs && getComputedStyle(tabs).position === 'fixed';
  drag = {
    id: row.dataset.id, status: list.dataset.grp, list, row, grip, rows, pid: e.pointerId,
    boxes: rows.map(r => { const b = r.getBoundingClientRect(); return { top: b.top + sy, h: b.height }; }),
    from: rows.indexOf(row), to: rows.indexOf(row), startY: e.clientY + sy, y: e.clientY, y0: e.clientY, moved: false, dirty: false, raf: 0,
    topLim: top ? Math.max(0, top.getBoundingClientRect().bottom) : 0,
    botLim: tabsFixed ? tabs.getBoundingClientRect().top : window.innerHeight
  };
  try { grip.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ }
  row.classList.add('lift'); list.classList.add('dragging');
  buzz();
  drag.raf = requestAnimationFrame(dragTick);
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  e.preventDefault();
  drag.y = e.clientY;
  dragMove();
}, { passive: false });
document.addEventListener('pointerup', e => dragEnd(e, false));
document.addEventListener('pointercancel', e => dragEnd(e, true));
window.addEventListener('blur', () => { if (drag) dragEnd(null, true); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
window.addEventListener('online', drawSync);
window.addEventListener('offline', drawSync);

/* ================= 시작 ================= */
function registerSW() {

  const had = !!navigator.serviceWorker.controller;
  let shown = false;

  });
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => { /* 무시 */ }); });
}
function boot() {
  const st = history.state;
  if (st && typeof st.d === 'number' && !h0) { S.ui.tab = TABS.includes(st.tab) ? st.tab : 'today'; S.ui.proj = st.proj || null; S.ui.pjSort = !!st.sort && S.ui.tab === 'proj' && !S.ui.proj; }
  else hReplace({ tab: S.ui.tab, proj: null, d: 0 }, location.pathname + location.search);
  registerSW();
  if (CFG && P.mode !== 'local') startFirebase();
  else startLocal();
  draw();
}
boot();
